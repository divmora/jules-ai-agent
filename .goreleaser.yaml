version: 2

project_name: jules-ai-agent

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: jules-ai-agent
    main: .
    binary: jules-ai-agent
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: jules-ai-agent-archive
    ids:
      - jules-ai-agent
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - ROADMAP.md
      - AGENTS.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '(?i)^docs:'
      - '(?i)^test:'
      - '(?i)^chore:'
      - 'Merge pull request'
      - 'Merge branch'
  groups:
    - title: '✨ Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: '🐛 Bug Fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: '⚡ Performance Improvements'
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: '🔒 Security Updates'
      regexp: "^.*sec[(\\w)]*:+.*$"
      order: 3
    - title: '♻️ Refactoring'
      regexp: "^.*refactor[(\\w)]*:+.*$"
      order: 4
    - title: '📚 Documentation'
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 5
    - title: '🧪 Testing & QA'
      regexp: "^.*test[(\\w)]*:+.*$"
      order: 6
    - title: '🔧 Tooling & CI'
      regexp: "^.*chore[(\\w)]*:+.*$"
      order: 7
    - title: 'Other Changes'
      order: 999

release:
  github:
    owner: divmora
    name: jules-ai-agent
  draft: false
  prerelease: auto
  mode: replace
