apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: jules-bolt-perf
spec:
  image: ghcr.io/divmora/jules-ai-agent-ax:latest
  command:
    - jules
    - --agent
    - bolt
    - --workspace
    - /workspace
    - --prompt
    - "Identify performance bottlenecks, unoptimized queries, or redundant renders and optimize them"
  workspaces:
    - name: target-workspace
      path: /workspace
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
